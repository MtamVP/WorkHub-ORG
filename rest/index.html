<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Lounge Area | WorkHub ORG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/rest/style.css?v=1785322723319">

</head>
<body class="bg-dark text-light overflow-hidden">
    <div id="warp-flash"></div>
    <div class="hud-top-bar d-flex justify-content-between align-items-center p-3 w-100 position-absolute top-0 start-0" style="z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);">
        <div class="d-flex align-items-center gap-3">
            <h4 class="mb-0 fw-bold" style="color: #00d2ff; text-shadow: 0 0 10px #00d2ff;"><i class="fa-solid fa-satellite-dish"></i> WorkHub Lounge</h4>
            <span class="badge bg-success border border-light rounded-pill px-3 py-2 shadow" style="box-shadow: 0 0 10px #198754 !important;">
                <i class="fa-solid fa-wifi fa-fade"></i> Live Sync
            </span>
        </div>
        <div>
            <button id="btn-back-to-work" class="btn btn-outline-info btn-sm rounded-pill fw-bold shadow-sm backdrop-blur">
                <i class="fa-solid fa-person-walking-arrow-right"></i> Quay lại làm việc
            </button>
        </div>
    </div>

    <div id="lounge-room" class="position-relative w-100 h-100">
        <!-- <canvas id="fireworks-canvas"></canvas>
        <div class="meteor-shower">
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
            <div class="meteor"></div>
        </div> -->
        <div class="sci-fi-floor"></div>
        <div class="holo-base"></div>
        <div class="holo-earth"></div>
        <div id="my-player" class="player" style="left: 50%; top: 70%;">
            <div class="nameplate">
                <span class="status-dot in-lounge"></span>
                <span class="player-name">Tôi (In Lounge)</span>
            </div>
            <div class="crewmate">
                <div class="backpack"></div>
                <div class="body" id="my-body-color">
                    <div class="visor"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-panel" class="position-absolute bottom-0 start-0 m-4 p-3 rounded-4 shadow-lg border border-secondary" style="background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); width: 280px; z-index: 100;">
        <h6 class="text-uppercase text-info fw-bold mb-3 border-bottom border-info pb-2"><i class="fa-solid fa-user-astronaut"></i> Giao diện cá nhân</h6>
        
        <div class="mb-3">
            <label class="form-label text-light small fw-bold"><i class="fa-solid fa-palette"></i> Màu trang phục:</label>
            <div class="d-flex align-items-center gap-2">
                <input type="color" id="color-picker" class="form-control form-control-color bg-dark border-secondary p-1" value="#e74c3c" style="cursor: pointer;">
                <span class="small text-muted fst-italic">Tùy chỉnh Crewmate</span>
            </div>
        </div>
        
        <div class="alert alert-dark border-secondary py-2 px-3 mb-0 small" role="alert" style="background: rgba(0,0,0,0.5);">
            <i class="fa-solid fa-computer-mouse text-warning"></i> Click vô để di chuyển.
        </div>
    </div>

    <div id="multiplayer-panel" class="position-absolute bottom-0 end-0 m-4 p-3 rounded-4 shadow-lg border border-secondary d-flex flex-column" style="background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); width: 260px; max-height: 350px; z-index: 100;">
        <h6 class="text-uppercase text-success fw-bold mb-3 border-bottom border-success pb-2 d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-users-viewfinder"></i> Thành viên</span>
            <span id="player-count" class="badge bg-success rounded-pill">Đang quét...</span>
        </h6>
        
        <div id="radar-list" class="overflow-auto flex-grow-1 pe-2" style="font-size: 0.85rem;">
            <div class="d-flex align-items-center mb-2 text-light">
                <span class="status-dot in-lounge me-2" style="box-shadow: 0 0 5px #9b59b6; background-color: #9b59b6;"></span> 
                <span class="fw-bold">B?n</span>
                <span class="ms-auto text-muted small">[Local]</span>
            </div>
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api.js?v=1786892210569"></script>
    <script src="script.js?v=1786178129444"></script>

</body>
