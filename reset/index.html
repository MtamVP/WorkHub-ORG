<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - WorkHub AI</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css?v=3.0.4">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#120F0A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api.js?v=1785061363157"></script>
</head>
<body class="auth-page">

    <div class="auth-stars"></div>
    <div class="auth-twinkling"></div>

    
    <input type="file" id="login-bg-input" accept="image/*" style="display: none;" onchange="handleLoginBgUpload(this)">

    <div class="auth-card auth-card-wide">
        <div id="alert-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="reset-form">
            <h3 style="font-weight:800; margin-bottom:25px;"><i class="fa-solid fa-shield-halved text-warning me-2"></i> Đổi Mật khẩu</h3>

            <div class="mb-3">
                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                <div class="auth-input-group">
                    <span class="auth-input-icon"><i class="fa-solid fa-key"></i></span>
                    <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="Nhập mật khẩu mới">
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Xác nhận Mật khẩu mới</label>
                <div class="auth-input-group">
                    <span class="auth-input-icon"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
                </div>
            </div>

            <button type="submit" class="auth-btn-submit">
                <i class="fa-solid fa-floppy-disk me-2"></i> Cập nhật Mật khẩu
            </button>

            <button type="button" class="auth-btn-secondary" id="back-to-dashboard-btn">
                <i class="fa-solid fa-arrow-left me-2"></i> Trở về Dashboard
            </button>
        </form>
    </div>

    <script>
        // 1. CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey : "AIzaSyCCCIzKdnvslSrvknrl0eQH1cL8_upv1PI",
            authDomain : "workhub-ai-2d5aa.firebaseapp.com",
            projectId : "workhub-ai-2d5aa",
            storageBucket : "workhub-ai-2d5aa.firebasestorage.app",
            messagingSenderId : "703705936779",
            appId : "1:703705936779:web:b800246feea1f3e3cf358e"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. ĐIỀU HƯỚNG
        function goToDashboard() { window.location.href = "/dashboard/"; }
        function goToLogin() { window.location.href = "/"; }

        // 3. LOGIC HÌNH NỀN
        function handleLoginBgUpload(input) {
            if (input.files && input.files[0]) {
                var file = input.files[0];
                if (file.size > 700 * 1024) { Swal.fire("Ảnh nặng quá!", "Ảnh lưu vào Firestore (giới hạn 1MB/document) nên cần dưới 700KB.", "warning"); return; }

                const btnIcon = document.querySelector('.auth-btn-control i.fa-camera');
                const oldClass = btnIcon.className;
                btnIcon.className = "fa-solid fa-spinner fa-spin";

                var reader = new FileReader();
                reader.onload = function(e) {
                    db.collection("settings").doc("login_theme").set({
                        backgroundImage: e.target.result,
                        updatedBy: auth.currentUser ? auth.currentUser.email : 'Unknown',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        btnIcon.className = oldClass;
                        Swal.fire({ icon: 'success', title: 'Thành công!', text: 'Đã cập nhật hình nền Login.', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    }).catch(err => {
                        btnIcon.className = oldClass; Swal.fire("Lỗi", err.message, "error");
                    });
                }
                reader.readAsDataURL(file);
            }
        }

        function confirmResetTheme() {
            Swal.fire({
                title: 'Reset giao diện?', text: "Xóa ảnh nền và quay về mặc định?", icon: 'question',
                showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ok, xóa đi ní!', cancelButtonText: 'Khoan...'
            }).then((result) => {
                if (result.isConfirmed) {
                    db.collection("settings").doc("login_theme").update({
                        backgroundImage: firebase.firestore.FieldValue.delete()
                    }).then(() => {
                        Swal.fire({ icon: 'success', title: 'Đã Reset!', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    });
                }
            });
        }

        function initLoginThemeListener() {
            db.collection("settings").doc("login_theme").onSnapshot((doc) => {
                if (doc.exists && doc.data().backgroundImage) {
                    var imageUrl = doc.data().backgroundImage;
                    var finalValue = imageUrl.startsWith('url') ? imageUrl : "url('" + imageUrl + "')";
                    document.documentElement.style.setProperty('--login-bg-image', finalValue);
                    document.body.classList.add('has-custom-bg');
                } else {
                    document.documentElement.style.removeProperty('--login-bg-image');
                    document.body.classList.remove('has-custom-bg');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initLoginThemeListener();

            const resetForm = document.getElementById('reset-form');
            const alertMessage = document.getElementById('alert-message');
            const backToDashboardBtn = document.getElementById('back-to-dashboard-btn');

            function showAlert(message, type = 'danger') {
                alertMessage.innerHTML = message;
                alertMessage.className = 'alert alert-' + type;
                alertMessage.classList.remove('d-none');
            }

            // Kiểm tra đăng nhập
            auth.onAuthStateChanged(function(user) {
                if (!user) goToLogin();
            });

            // Xử lý Submit
            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alertMessage.classList.add('d-none');

                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;
                const user = auth.currentUser;

                if (newPass !== confirmPass) { showAlert('Mật khẩu xác nhận không khớp.'); return; }
                if (!user) { showAlert('Vui lòng đăng nhập lại.'); setTimeout(goToLogin, 2000); return; }

                const btnSubmit = resetForm.querySelector('button[type="submit"]');
                const oldText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
                btnSubmit.disabled = true;

                // Gọi Firebase Update Password
                user.updatePassword(newPass).then(() => {
                    if (window.API && API.system) {
                        API.system.logAction(Date.now().toString(), 'auth', `Đã đổi mật khẩu thành công`, 'success', user.email, 'all');
                    }
                    Swal.fire({
                        title: 'Thành công!',
                        text: 'Mật khẩu đã được thay đổi. Vui lòng đăng nhập lại.',
                        icon: 'success',
                        confirmButtonText: 'Đăng nhập lại'
                    }).then(() => {
                        auth.signOut().then(() => goToLogin());
                    });
                }).catch(err => {
                    btnSubmit.innerHTML = oldText; btnSubmit.disabled = false;

                    let msg = err.message;
                    if(err.code === 'auth/requires-recent-login') {
                        msg = "Để bảo mật, bạn cần đăng xuất và đăng nhập lại trước khi đổi mật khẩu.";
                    }
                    showAlert('Lỗi: ' + msg);
                });
            });

            backToDashboardBtn.addEventListener('click', goToDashboard);
        });
    </script>
</body>
</html>
