<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Note | WorkHub Finance</title>
    <link rel="icon" type="image/png" href="../../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Jost:wght@200;300;400;500&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <script>
      /* Dong bo dark mode voi app shell truoc khi trang ve (cung logic voi script.js: auto = 18h-6h) */
      (function () {
        try {
          var t = localStorage.getItem('user-theme');
          var h = new Date().getHours();
          if (t === 'dark' || ((t === 'auto' || !t) && (h >= 18 || h < 6))) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=3.0.3">
    <link rel="stylesheet" href="/finance/note/style.css?v=3.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#B08D57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
</head>
<body>

    <div class="board-container">
        <div class="top-bar">
            <div class="left-section">
                <a href="../" class="back-link">
                    <i class="fa-solid fa-house"></i> <span>Finance</span>
                </a>
                <h1><i class="fa-solid fa-note-sticky" style="color:var(--finance-accent);"></i> Daily Note</h1>
                <span class="date-badge" id="today-date">--/--/----</span>
            </div>
            
            <div class="right-section">
                <button onclick="loadNotes()" class="btn-refresh">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
                <button onclick="openNoteModal()" class="btn-add">
                    <i class="fa-solid fa-plus"></i> Dán Note Mới
                </button>
            </div>
        </div>

        <div id="board-loading" style="text-align: center; padding: 50px; display: none;">
            <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--finance-accent);"></i>
            <p>Đang tải bảng tin...</p>
        </div>
        
        <div class="notes-board" id="notes-board">
            </div>
    </div>

    <div id="note-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Viết Note</h3>
                <button class="close-btn" onclick="closeNoteModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Người dán:</label>
                    <select id="note-author" class="form-control">
                        <option value="">-- Đang tải user... --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nội dung Note</label>
                    <textarea id="note-content" class="form-control" rows="5" placeholder="Nhập nội dung note..."></textarea>
                </div>
                <button id="btn-submit-note" class="btn-submit" onclick="submitNote()">Dán lên bảng</button>
            </div>
        </div>
    </div>

    <script src="../../api.js"></script>
    <script src="script.js"></script>
</body>
</html>
