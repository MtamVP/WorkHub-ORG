<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHub ORG - Đăng Nhập</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css?v=3.3.11">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#120F0A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo.png">



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js?v=1788531970926"></script>
    <script src="oauth-loopback.js?v=1"></script>
</head>
<body class="auth-page">

    <input type="file" id="login-bg-input" accept="image/*" style="display: none;" onchange="handleLoginBgUpload(this)">

    <div class="login-split">
        <div class="login-brand-pane" id="login-brand-pane">
            <div class="login-brand-parallax" id="login-brand-parallax">
                <div class="login-brand-wash"></div>
            </div>
            <canvas class="login-brand-canvas" id="login-net-canvas"></canvas>
            <div class="login-brand-watermark" aria-hidden="true">Org</div>
            <div class="login-brand-grain"></div>
            <div class="login-brand-vignette"></div>
            <div class="login-brand-top">
                <div class="login-brand-mark"><img src="/logo.png" alt=""></div>
                <span>WorkHub Org</span>
            </div>
            <div class="login-brand-bottom">WorkHub suite — Fin · Sci · Org</div>
        </div>

        <div class="login-form-pane" id="login-form-pane">
            <div class="login-form-glow" id="login-form-glow"></div>
            <button type="button" class="login-theme-pill" id="login-theme-pill" onclick="toggleLoginTheme()" aria-label="Chuyển chế độ Sáng/Tối">
                <i class="fa-solid fa-sun login-theme-icon icon-sun" aria-hidden="true"></i>
                <i class="fa-solid fa-moon login-theme-icon icon-moon" aria-hidden="true"></i>
            </button>
            <div class="login-form-top-mark">Cổng quản trị nội bộ</div>

            <div class="login-form-mid">
                <div class="login-form-inner">
                    <div id="login-view">
                        <h2>Đăng nhập</h2>
                        <p class="auth-subtitle">Vào hệ thống quản trị WorkHub Org.</p>

                        <form id="login-form-main">
                            <div class="auth-input-group">
                                <span class="auth-input-icon"><i class="fa-solid fa-user-astronaut"></i></span>
                                <input type="text" id="username" class="form-control" placeholder=" " required>
                                <label for="username" class="auth-float-label">Tên đăng nhập / Email</label>
                            </div>

                            <div class="auth-input-group">
                                <span class="auth-input-icon"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="password" class="form-control" placeholder=" " required>
                                <label for="password" class="auth-float-label">Mật mã</label>
                            </div>

                            <button type="submit" class="auth-btn-submit">
                                Vào Hệ Thống <i class="fa-solid fa-arrow-right ms-2"></i>
                            </button>

                            <div class="text-center mt-3">
                                <a href="/forgot/" class="small text-decoration-none text-muted"> Quên mật khẩu?</a>
                            </div>
                            <div class="text-center mt-3" style="border-top:1px solid var(--border-color); padding-top:14px; margin-top:14px;">
                                <a href="#" class="small text-decoration-none text-muted" onclick="handleSsoLoginClick(event)">
                                    <i class="fa-solid fa-building-shield"></i> Đăng nhập bằng SSO doanh nghiệp
                                </a>
                            </div>
                        </form>

                        <div id="login-error-msg" class="auth-error-message"></div>
                        <div id="loading-status" class="text-center text-muted mt-3" style="display:none;">
                            <i class="fa-solid fa-satellite fa-spin"></i> Đang kết nối...
                        </div>
                    </div>

                    <div id="success-view" class="auth-success-view">
                        <div class="auth-success-icon">
                            <svg class="success-check" viewBox="0 0 52 52" width="54" height="54" aria-hidden="true">
                                <circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
                                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l8 8 16-17"/>
                            </svg>
                        </div>
                        <h4>Đăng nhập thành công!</h4>
                        <p class="text-muted mb-4" id="welcome-text">Đang tải trang...</p>

                        <button id="btn-go-dashboard" class="auth-btn-submit" style="background: var(--success-color);">
                             Vào Dashboard Ngay
                        </button>
                    </div>
                </div>
            </div>

            <div class="login-form-foot">© WorkHub — phiên bản nội bộ</div>
        </div>
    </div>

<script>
    // Khởi tạo Supabase Client từ api.js
    const auth = sbClient.auth;

    // 2. DOM ELEMENTS
    const loginView = document.getElementById('login-view');
    const successView = document.getElementById('success-view');
    const form = document.getElementById('login-form-main');
    const errorDiv = document.getElementById('login-error-msg');
    const loadingStatus = document.getElementById('loading-status');
    const welcomeText = document.getElementById('welcome-text');
    const btnGoDashboard = document.getElementById('btn-go-dashboard');

    function showToast(message, type = 'success') {
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            document.body.appendChild(container);
        }
        let iconClass = 'fa-circle-check';
        if (type === 'error') iconClass = 'fa-circle-exclamation';
        if (type === 'warning') iconClass = 'fa-triangle-exclamation';

        const toast = document.createElement('div');
        toast.className = `custom-toast ${type}`;
        // message trước đây chèn thẳng vào innerHTML -- luồng SSO (handleSsoLoginClick) đưa
        // thẳng err.message (bắt nguồn từ query param error_description trên redirect OAuth,
        // 1 IdP giả mạo/bị xâm nhập có thể nhét bất cứ gì vào đó) vào showToast(), mở đường
        // XSS ngay trên trang login trước khi kịp đăng nhập. Dùng textContent cho phần message
        // (không phải người dùng tự nhập markup) trong khi icon <i> tĩnh vẫn giữ nguyên qua
        // innerHTML riêng.
        toast.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        const msgSpan = document.createElement('span');
        msgSpan.textContent = message;
        toast.appendChild(msgSpan);
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'fadeOutRight 0.4s forwards';
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 400);
        }, 3000);
    }

    // THEME BACKGROUND LOGIC (Dùng Supabase app_settings) -- được viết cho layout .auth-card
    // cũ (1 thẻ nổi giữa nền body), nơi ảnh nền admin tuỳ chỉnh còn hiển thị được. Layout
    // split-screen mới phủ kín 2 nửa màn hình bằng nền đặc (mạng lưới navy bên trái, panel
    // form bên phải) nên body.has-custom-bg không còn chỗ nào lộ ra để thấy ảnh nền nữa.
    // Giữ nguyên các hàm này (không xoá) vì API.settings.getSetting/updateSetting đã nối
    // thật với DB -- chỉ ngưng tự gọi initLoginThemeListener() ở cuối, để dành cho một đợt
    // sau quyết định nút bấm đổi ảnh nền nên đặt ở đâu trong layout mới (chưa có UI nào gọi
    // checkAuthAndUpload()/checkAuthAndReset() từ trước tới giờ, bug này có sẵn không phải do
    // đợt sửa này gây ra).
    async function initLoginThemeListener() {
        // Fetch lần đầu
        const val = await API.settings.getSetting('login_theme');
        if (val) applyCustomBackground(val);
        else removeCustomBackground();

        // Lắng nghe thay đổi realtime
        sbClient.channel('custom-login-theme-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings', filter: 'key=eq.login_theme' }, (payload) => {
                if (payload.new && payload.new.value) applyCustomBackground(payload.new.value);
                else removeCustomBackground();
            })
            .subscribe();
    }

    function applyCustomBackground(imageUrl) {
        var finalValue = imageUrl.startsWith('url') ? imageUrl : "url('" + imageUrl + "')";
        document.documentElement.style.setProperty('--login-bg-image', finalValue);
        document.body.classList.add('has-custom-bg');
    }

    function removeCustomBackground() {
        document.documentElement.style.removeProperty('--login-bg-image');
        document.body.classList.remove('has-custom-bg');
    }

    async function checkAuthAndUpload() {
        const { data: { user } } = await auth.getUser();
        if (!user) {
            showToast("Vui lòng đăng nhập thành công trước khi đổi nền!", "warning");
            return;
        }
        document.getElementById('login-bg-input').click();
    }

    async function checkAuthAndReset() {
        const { data: { user } } = await auth.getUser();
        if (!user) {
            Swal.fire({ icon: 'warning', title: 'Chưa đăng nhập!', text: 'Bạn cần đăng nhập mới có quyền Reset giao diện.', confirmButtonColor: '#1A1A1A' });
            return;
        }
        Swal.fire({
            title: 'Trở về mặc định?', text: "Bạn có chắc muốn xóa ảnh nền hiện tại?", icon: 'question',
            showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Xóa đi ạ'
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.showLoading();
                await API.settings.updateSetting('login_theme', '', user.email);
                removeCustomBackground();
                Swal.fire('Đã xóa!', 'Giao diện về mặc định.', 'success');
            }
        });
    }

    function handleLoginBgUpload(input) {
        if (input.files && input.files[0]) {
            var file = input.files[0];
            if (file.size > 700 * 1024) { alert("Ảnh nặng quá (>700KB). Cần dưới mức này sau khi mã hóa base64."); return; }

            // .auth-btn-control không còn tồn tại trong layout hiện tại (nút đổi ảnh nền đã
            // bị ẩn cùng initLoginThemeListener() ở trên) -- input#login-bg-input vẫn còn
            // onchange trỏ vào hàm này nên trước đây querySelector trả về null làm crash
            // ngay dòng kế (Cannot read properties of null) nếu handler này lỡ chạy.
            const btnIcon = document.querySelector('.auth-btn-control i');
            const oldClass = btnIcon ? btnIcon.className : '';
            if (btnIcon) btnIcon.className = "fa-solid fa-spinner fa-spin";

            var reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const { data: { user } } = await auth.getUser();
                    const userEmail = user ? user.email : "admin@workhub.com";
                    await API.settings.updateSetting('login_theme', e.target.result, userEmail);
                    applyCustomBackground(e.target.result);
                    if (btnIcon) btnIcon.className = oldClass;
                } catch(err) {
                    alert(err.message);
                    if (btnIcon) btnIcon.className = oldClass;
                }
            }
            reader.readAsDataURL(file);
        }
    }
    // initLoginThemeListener(); -- xem comment ở khai báo hàm phía trên: tạm ngưng gọi vì
    // layout mới không còn chỗ hiển thị ảnh nền tuỳ chỉnh. Hàm/backend vẫn còn nguyên.


    async function handleSsoLoginClick(e) {
        e.preventDefault();
        if (!window.OAuthLoopback || !window.OAuthLoopback.isTauri()) {
            showToast('SSO doanh nghiệp chỉ khả dụng trên bản desktop app.', 'warning');
            return;
        }
        const { value: domain } = await Swal.fire({
            title: 'Đăng nhập SSO doanh nghiệp', input: 'text',
            inputLabel: 'Tên miền công ty (vd: yourcompany.com)',
            showCancelButton: true, confirmButtonText: 'Tiếp tục', cancelButtonText: 'Hủy'
        });
        if (!domain) return;
        try {
            const { data, error } = await auth.signInWithSSO({
                domain: domain.trim(), options: { redirectTo: window.OAuthLoopback.OAUTH_CALLBACK_URL }
            });
            if (error) throw error;
            if (!data || !data.url) throw new Error('Không nhận được URL đăng nhập SSO.');
            const queryString = await window.OAuthLoopback.awaitRedirect(data.url);
            const params = window.OAuthLoopback.parseQueryString(queryString);
            if (params.error) throw new Error(params.error_description || params.error);
            if (!params.code) throw new Error('Không nhận được mã xác thực từ SSO.');
            sessionStorage.setItem('just_logged_in', 'true');
            const { error: exErr } = await auth.exchangeCodeForSession(params.code);
            if (exErr) throw exErr;
        } catch (err) {
            const msg = err.message || String(err);
            if (/sso|saml|provider not found/i.test(msg)) {
                showToast('SSO chưa được bật cho tổ chức này.', 'warning');
            } else {
                showToast('Đăng nhập SSO thất bại: ' + msg, 'error');
            }
        }
    }

    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorDiv.textContent = '';

            const inputVal = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!inputVal) { errorDiv.textContent = "Chưa nhập tên đăng nhập!"; return; }

            form.style.display = 'none';
            loadingStatus.style.display = 'block';
            loadingStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang kết nối máy chủ...';

            try {
                // Sử dụng API lấy Real Email từ Supabase
                const realEmail = await API.auth.getRealEmail(inputVal) || inputVal;

                loadingStatus.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Đang xác thực Supabase...';
                
                // Đánh dấu là người dùng vừa chủ động đăng nhập
                sessionStorage.setItem('just_logged_in', 'true');

                // Đăng nhập Supabase
                const { error } = await auth.signInWithPassword({
                    email: realEmail,
                    password: password
                });

                if (error) throw error;

            } catch (err) {
                console.error(err);
                loadingStatus.style.display = 'none';
                form.style.display = 'block';

                let msg = err.message;
                if(msg.includes('Invalid login credentials')) msg = "Sai email hoặc mật khẩu!";

                errorDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + msg;
            }
        });
    }

    auth.onAuthStateChange(async function(event, session) {
        const user = session?.user;
        if (user) {
            loginView.style.display = 'none';
            successView.style.display = 'block';

            welcomeText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu người dùng...';
            btnGoDashboard.disabled = true;

            try {
                // Gọi API Supabase để lấy thông tin user
                const userInfoRes = await API.auth.getUserInfo(user.email);

                // Vô hiệu hoá thay xoá cứng (enterprise-readiness round-2). So sánh chặt
                // === false: userInfoRes chỉ thiếu field active khi lỗi/không tìm thấy hàng,
                // trường hợp đó không được chặn (fail-open như hành vi cũ).
                if (userInfoRes && userInfoRes.active === false) {
                    await auth.signOut();
                    if (loadingStatus) loadingStatus.style.display = 'none';
                    loginView.style.display = 'block';
                    successView.style.display = 'none';
                    errorDiv.innerHTML = '<i class="fa-solid fa-ban"></i> Tài khoản của bạn đã bị vô hiệu hóa. Vui lòng liên hệ quản trị viên.';
                    return;
                }

                const group = await API.auth.getUserGroup(user.email);

                let displayName = user.user_metadata?.display_name || user.email.split('@')[0];

                if (userInfoRes) {
                    if (userInfoRes.data) {
                        displayName = userInfoRes.data.name || displayName;
                    } else if (userInfoRes.name) {
                        displayName = userInfoRes.name || displayName;
                    }
                }

                localStorage.setItem('userGroup', group);
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', displayName);

                // Ghi log đăng nhập (Chỉ ghi nếu người dùng vừa chủ động bấm nút Đăng nhập)
                if (window.API && API.system && sessionStorage.getItem('just_logged_in') === 'true') {
                    API.system.logAction(Date.now().toString(), 'login', `Người dùng ${displayName} đã đăng nhập hệ thống`, 'success', user.email, group);
                    sessionStorage.removeItem('just_logged_in');
                }

                welcomeText.textContent = `Xin chào, ${displayName}!`;
                btnGoDashboard.disabled = false;

                setTimeout(() => {
                    if(!user.user_metadata?.display_name && displayName === user.email.split('@')[0]) {
                        window.location.href = "/nickname/";
                    } else {
                        window.location.href = "/dashboard/";
                    }
                }, 1500);
            } catch (error) {
                console.error("Lỗi lấy quyền:", error);
                localStorage.setItem('userGroup', 'guest');
                welcomeText.textContent = "Chế độ khách";
                btnGoDashboard.disabled = false;
            }

        } else {
            if (loadingStatus) loadingStatus.style.display = 'none';
            loginView.style.display = 'block';
            successView.style.display = 'none';
        }
    });

    btnGoDashboard.onclick = function() {
        window.location.href = "/dashboard/";
    };

    // Theme -- form pane follows the app's own light/dark preference (the old fixed-dark
    // .auth-card layout this replaces did not). Reads/writes the same 'user-theme'
    // localStorage key as dashboard's applyTheme()/toggleTheme() (script.js) for continuity
    // across the login->dashboard hop, but is a small self-contained copy rather than
    // loading all of script.js here (that file assumes dashboard-only DOM elements).
    (function () {
        var START_NIGHT_HOUR = 18, END_NIGHT_HOUR = 6;
        function isNightTime() {
            var h = new Date().getHours();
            return (h >= START_NIGHT_HOUR || h < END_NIGHT_HOUR);
        }
        function applyLoginTheme() {
            var saved = localStorage.getItem('user-theme');
            var theme = (saved === 'dark' || saved === 'light') ? saved : (isNightTime() ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            // Icon sáng/tối tự chuyển bằng CSS theo [data-theme] (xem .login-theme-icon
            // trong style.css) -- không cần đổi className ở đây nữa.
        }
        window.toggleLoginTheme = function () {
            var cur = document.documentElement.getAttribute('data-theme');
            localStorage.setItem('user-theme', cur === 'dark' ? 'light' : 'dark');
            applyLoginTheme();
        };
        applyLoginTheme();
    })();

    // Panel bên phải: quầng sáng bám theo con trỏ (chỉ trang trí, không ảnh hưởng logic form).
    (function () {
        var pane = document.getElementById('login-form-pane');
        var glow = document.getElementById('login-form-glow');
        if (!pane || !glow) return;
        pane.addEventListener('pointermove', function (e) {
            var rect = pane.getBoundingClientRect();
            glow.style.left = (e.clientX - rect.left - 320) + 'px';
            glow.style.top = (e.clientY - rect.top - 320) + 'px';
        });
    })();

    // Parallax rất nhẹ cho lớp wash bên brand pane theo vị trí con trỏ -- thuần trang trí.
    // Set transform trên .login-brand-parallax (KHÔNG phải .login-brand-wash), vì wash có
    // sẵn animation CSS (login-wash) trên chính thuộc tính transform -- animation luôn thắng
    // transform inline trên cùng 1 phần tử, gộp chung sẽ làm parallax mất tác dụng.
    (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var pane = document.getElementById('login-brand-pane');
        var parallax = document.getElementById('login-brand-parallax');
        if (!pane || !parallax) return;
        pane.addEventListener('pointermove', function (e) {
            var rect = pane.getBoundingClientRect();
            var px = (e.clientX - rect.left) / rect.width - 0.5;
            var py = (e.clientY - rect.top) / rect.height - 0.5;
            parallax.style.transform = 'translate(' + (px * -14).toFixed(1) + 'px, ' + (py * -10).toFixed(1) + 'px)';
        });
        pane.addEventListener('pointerleave', function () { parallax.style.transform = ''; });
    })();

    // Mạng lưới điểm-nối-điểm trên brand pane -- thuần trang trí, không phụ thuộc/ảnh hưởng
    // gì tới logic đăng nhập phía trên. Luôn dùng màu navy tối (không theo data-theme, xem
    // comment ở .login-brand-wash trong style.css).
    (function () {
        var canvas = document.getElementById('login-net-canvas');
        var pane = document.getElementById('login-brand-pane');
        if (!canvas || !pane) return;
        var ctx = canvas.getContext('2d');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
        var nodes = [];
        var hub = { x: 0, y: 0 };
        var pointer = { x: -9999, y: -9999, active: false };
        var t = 0;
        var NODE_COUNT = 26, LINK_DIST = 170, POINTER_DIST = 240;

        function resize() {
            var rect = pane.getBoundingClientRect();
            W = rect.width; H = rect.height;
            canvas.width = W * dpr; canvas.height = H * dpr;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            hub.x = W * 0.30; hub.y = H * 0.38;
        }

        function seed() {
            nodes = [];
            for (var i = 0; i < NODE_COUNT; i++) {
                var radius = 90 + Math.random() * Math.min(W, H) * 0.62;
                var angle = Math.random() * Math.PI * 2;
                var speed = (0.10 + Math.random() * 0.22) * (Math.random() < 0.5 ? 1 : -1);
                nodes.push({
                    orbitR: radius, angle: angle, speed: speed / radius * 26,
                    bob: Math.random() * Math.PI * 2,
                    r: 1.3 + Math.random() * 2.1,
                    depth: 0.5 + Math.random() * 0.5
                });
            }
        }

        function step() {
            t += 1;
            for (var i = 0; i < nodes.length; i++) {
                var n = nodes[i];
                n.angle += n.speed * 0.01;
                n.x = hub.x + Math.cos(n.angle) * n.orbitR;
                n.y = hub.y + Math.sin(n.angle) * n.orbitR * 0.72 + Math.sin(t * 0.01 + n.bob) * 8;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            for (var i = 0; i < nodes.length; i++) {
                var a = nodes[i];
                var dxh = a.x - hub.x, dyh = a.y - hub.y;
                var dh = Math.sqrt(dxh * dxh + dyh * dyh);
                if (dh < LINK_DIST * 2.4) {
                    var alphaH = Math.max(0, (1 - dh / (LINK_DIST * 2.4))) * 0.5 * a.depth;
                    ctx.strokeStyle = 'rgba(134, 162, 196, ' + alphaH + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(hub.x, hub.y); ctx.lineTo(a.x, a.y); ctx.stroke();
                }
                for (var j = i + 1; j < nodes.length; j++) {
                    var b = nodes[j];
                    var dx = a.x - b.x, dy = a.y - b.y;
                    var d = Math.sqrt(dx * dx + dy * dy);
                    if (d < LINK_DIST) {
                        var alpha = (1 - d / LINK_DIST) * 0.24 * Math.min(a.depth, b.depth);
                        ctx.strokeStyle = 'rgba(134, 162, 196, ' + alpha + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                    }
                }
                if (pointer.active) {
                    var pdx = a.x - pointer.x, pdy = a.y - pointer.y;
                    var pd = Math.sqrt(pdx * pdx + pdy * pdy);
                    if (pd < POINTER_DIST) {
                        var palpha = (1 - pd / POINTER_DIST) * 0.6;
                        ctx.strokeStyle = 'rgba(210, 224, 240, ' + palpha + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(pointer.x, pointer.y); ctx.lineTo(a.x, a.y); ctx.stroke();
                    }
                }
            }
            for (var k = 0; k < nodes.length; k++) {
                var node = nodes[k];
                ctx.save();
                ctx.shadowColor = 'rgba(134, 162, 196, 0.9)';
                ctx.shadowBlur = 8 * node.depth;
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(214, 226, 240, ' + (0.55 + node.depth * 0.4) + ')';
                ctx.fill();
                ctx.restore();
            }
            ctx.save();
            ctx.shadowColor = 'rgba(150, 178, 212, 1)';
            // Nhịp thở nhẹ ~5s/chu kỳ ở 60fps; giữ mức tĩnh 22 khi reduce-motion.
            ctx.shadowBlur = reduceMotion ? 22 : (20 + Math.sin(t * 0.012) * 6);
            ctx.beginPath();
            ctx.arc(hub.x, hub.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#F3EFE6';
            ctx.fill();
            ctx.restore();
            if (pointer.active) {
                ctx.save();
                ctx.shadowColor = 'rgba(251, 243, 248, 1)'; ctx.shadowBlur = 14;
                ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(251, 243, 248, 0.95)'; ctx.fill();
                ctx.restore();
            }
        }

        function loop() { step(); draw(); requestAnimationFrame(loop); }

        pane.addEventListener('pointermove', function (e) {
            var rect = pane.getBoundingClientRect();
            pointer.x = e.clientX - rect.left; pointer.y = e.clientY - rect.top;
            pointer.active = true;
        });
        pane.addEventListener('pointerleave', function () { pointer.active = false; });
        window.addEventListener('resize', function () { resize(); });

        resize(); seed(); step(); draw();
        if (!reduceMotion) requestAnimationFrame(loop);
    })();
</script>
</body>
</html>
