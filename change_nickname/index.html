<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Biệt Danh</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css?v=3.0.3">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#120F0A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WorkHub">
    <link rel="apple-touch-icon" href="/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api.js?v=1784713168016"></script>

    <style>
        .auth-avatar-preview:hover { transform: scale(1.05) rotate(5deg); }
    </style>
</head>
<body class="auth-page">

    <div class="auth-stars"></div>
    <div class="auth-twinkling"></div>

    <div class="auth-theme-controls">
        <button class="auth-btn-control" onclick="document.getElementById('login-bg-input').click()" title="Đổi hình nền Login">
            <i class="fa-solid fa-camera"></i>
        </button>
        <button class="auth-btn-control" onclick="confirmResetTheme()" title="Reset về vũ trụ">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
    </div>
    <input type="file" id="login-bg-input" accept="image/*" style="display: none;" onchange="handleLoginBgUpload(this)">

    <div class="auth-card auth-card-wide" style="text-align:center;">
        <h3 class="mb-4" style="font-weight:800;"><i class="fa-solid fa-id-card-clip text-info me-2"></i> Đổi Biệt Danh</h3>

        <img id="preview-avatar" src="https://ui-avatars.com/api/?name=User&background=random&size=128&bold=true" class="auth-avatar-preview" alt="Xem trước avatar">
        <p class="text-muted small mb-4">Nhập tên mới để xem trước Avatar</p>

        <form id="change-form">
            <div class="mb-3">
                <input type="text" class="form-control text-center fw-bold" id="newNickname" required placeholder="Nhập biệt danh mới" autocomplete="off" style="height:48px; border-radius: var(--radius-md);">
            </div>

            <button type="submit" class="auth-btn-submit">
                <i class="fa-solid fa-floppy-disk me-2"></i> Lưu thay đổi
            </button>
            <button type="button" class="auth-btn-secondary" onclick="goToDashboard()">
                <i class="fa-solid fa-arrow-left me-2"></i> Hủy bỏ
            </button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey : "AIzaSyCCCIzKdnvslSrvknrl0eQH1cL8_upv1PI",
            authDomain : "workhub-ai-2d5aa.firebaseapp.com",
            projectId : "workhub-ai-2d5aa",
            storageBucket : "workhub-ai-2d5aa.firebasestorage.app",
            messagingSenderId : "703705936779",
            appId : "1:703705936779:web:b800246feea1f3e3cf358e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function goToDashboard() { window.location.href = "/dashboard/"; }
        function goToLogin() { window.location.href = "/"; }

        function handleLoginBgUpload(input) {
            if (input.files && input.files[0]) {
                var file = input.files[0];
                if (file.size > 700 * 1024) { Swal.fire("Ảnh nặng quá!", "Ảnh lưu vào Firestore (giới hạn 1MB/document) nên cần dưới 700KB.", "warning"); return; }

                const btnIcon = document.querySelector('.auth-btn-control i.fa-camera');
                const oldClass = btnIcon.className;
                btnIcon.className = "fa-solid fa-spinner fa-spin";

                var reader = new FileReader();
                reader.onload = function(e) {
                    db.collection("settings").doc("login_theme").set({
                        backgroundImage: e.target.result,
                        updatedBy: auth.currentUser ? auth.currentUser.email : 'Unknown',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        btnIcon.className = oldClass;
                        Swal.fire({ icon: 'success', title: 'Đã đổi nền!', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    }).catch(err => {
                        btnIcon.className = oldClass; Swal.fire("Lỗi", err.message, "error");
                    });
                }
                reader.readAsDataURL(file);
            }
        }

        function confirmResetTheme() {
            Swal.fire({
                title: 'Reset giao diện?', text: "Xóa ảnh nền và quay về mặc định?", icon: 'question',
                showCancelButton: true, confirmButtonColor: '#d33', cancelButtonText: 'Khoan...', confirmButtonText: 'Ok, xóa đi ní!'
            }).then((result) => {
                if (result.isConfirmed) {
                    db.collection("settings").doc("login_theme").update({
                        backgroundImage: firebase.firestore.FieldValue.delete()
                    }).then(() => {
                        Swal.fire({ icon: 'success', title: 'Đã Reset!', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    });
                }
            });
        }

        db.collection("settings").doc("login_theme").onSnapshot((doc) => {
            if (doc.exists && doc.data().backgroundImage) {
                var imageUrl = doc.data().backgroundImage;
                var finalValue = imageUrl.startsWith('url') ? imageUrl : "url('" + imageUrl + "')";
                document.documentElement.style.setProperty('--login-bg-image', finalValue);
                document.body.classList.add('has-custom-bg');
            } else {
                document.documentElement.style.removeProperty('--login-bg-image');
                document.body.classList.remove('has-custom-bg');
            }
        });

        const newNicknameInput = document.getElementById('newNickname');
        const previewAvatar = document.getElementById('preview-avatar');

        newNicknameInput.addEventListener('input', function() {
            let name = this.value || "User";
            previewAvatar.src = 'https://ui-avatars.com/api/?name=' + name + '&background=random&size=128&bold=true';
        });

        auth.onAuthStateChanged(user => {
            if (!user) { goToLogin(); return; }
            newNicknameInput.value = user.displayName || "";
            newNicknameInput.dispatchEvent(new Event('input')); // Kích hoạt preview
        });

        document.getElementById('change-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newName = newNicknameInput.value.trim();
            const user = auth.currentUser;
            if(!newName || !user) return;

            Swal.fire({
                title: 'Đang cập nhật...',
                text: 'Đang đồng bộ dữ liệu với Google Sheet & Firebase',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const res = await API.auth.updateNickname(user.email, newName);

                if(res === "Success") {
                    await user.updateProfile({
                        displayName: newName,
                        photoURL: 'https://ui-avatars.com/api/?name=' + newName + '&background=random&size=128&bold=true'
                    });

                    Swal.fire({
                        title: 'Thành công!',
                        text: 'Biệt danh mới đã được lưu.',
                        icon: 'success',
                        confirmButtonText: 'Về Dashboard'
                    }).then(() => {
                        goToDashboard();
                    });

                } else {
                    throw new Error(res);
                }

            } catch (err) {
                console.error(err);
                Swal.fire('Lỗi', 'Không thể cập nhật: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
